name: OSS readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test the readiness auditor
        run: node --test scripts/oss-readiness.test.mjs

      - name: Audit OSS maintenance artifacts
        id: readiness
        uses: ./.github/actions/oss-readiness
        with:
          fail-under: "80"
          report-path: oss-readiness-report.md

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-readiness-report
          path: oss-readiness-report.md
          if-no-files-found: error
