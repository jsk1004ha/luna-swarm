name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.0
          - 22.x
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up artifact renderer Python
        id: artifact-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-artifacts.txt

      - name: Install artifact renderer dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-artifacts.txt
          python -I -c "import pypdfium2; from PIL import Image"

      - name: Check types
        run: npm run check

      - name: Lint correctness boundaries
        run: npm run lint

      - name: Run tests
        env:
          LUNA_SWARM_ARTIFACT_PYTHON: ${{ steps.artifact-python.outputs.python-path }}
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --audit-level=low

      - name: Verify package contents
        run: npm pack --dry-run

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and lint
        run: npm run check && npm run lint

      - name: Run bounded parallel contract tests
        run: npm run test:server:fast
